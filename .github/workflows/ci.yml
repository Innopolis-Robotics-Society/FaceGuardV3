name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  repository-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies if requirements.txt exists
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            echo "requirements.txt not found, skipping dependency installation"
          fi

      - name: Install pytest
        run: |
          pip install pytest

      - name: Check Python files compile
        run: |
          python -m compileall .

      - name: Run tests if tests directory exists
        run: |
          if [ -d tests ]; then
            if find tests -name "test_*.py" -o -name "*_test.py" | grep -q .; then
              pytest tests/
            else
              echo "Tests directory exists, but no pytest test files were found yet."
              echo "Test execution will be added after Assignment 4 Part 4 and Part 7 work."
            fi
          else
            echo "No tests directory found. Test execution will be added after Assignment 4 Part 4 and Part 7 work."
          fi