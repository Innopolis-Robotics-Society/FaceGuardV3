name: Course Task
description: Create an Assignment 5 course-process task
title: "Course Task: "
labels:
  - "type: course task"
body:
  - type: markdown
    attributes:
      value: |
        Use this template for Assignment 5 administrative, reporting, evidence, review, release, demo, or documentation tasks.
        Course Task issues do not count toward the required qualifying PBIs.
  - type: input
    id: task-title
    attributes:
      label: Task title
      placeholder: "Prepare Week 5 report screenshots"
    validations:
      required: true
  - type: dropdown
    id: assignment-part
    attributes:
      label: Assignment 5 part
      options:
        - Part 1 - Refine Product Backlog and plan Sprint 3
        - Part 2 - Respond to customer feedback on MVP v1
        - Part 3 - Document the development process and configuration management
        - Part 4 - Document the architecture
        - Part 5 - Create and link ADRs
        - Part 6 - Extend testing, QA, and Definition-of-Done evidence for MVP v2
        - Part 7 - Implement, release, and deploy MVP v2
        - Part 8 - Update and execute user acceptance tests
        - Part 9 - Conduct the Sprint Review
        - Part 10 - Conduct the Sprint Retrospective
        - Part 11 - Host the maintained documentation
        - Part 12 - Reflect on the week
        - Part 13 - Record a public sanitized demo video
        - Part 14 - Report on LLM usage
        - Week 5 README / Moodle PDF
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: "Describe the course task and the expected evidence."
    validations:
      required: true
  - type: dropdown
    id: work-status
    attributes:
      label: Work Status
      options:
        - To Do
        - Ready
        - In Progress
        - Review
        - Done
    validations:
      required: true
  - type: input
    id: assignee
    attributes:
      label: Assignee
      placeholder: "@github-username"
    validations:
      required: false
  - type: input
    id: reviewer
    attributes:
      label: Reviewer
      placeholder: "@github-username"
    validations:
      required: false
  - type: textarea
    id: expected-artifacts
    attributes:
      label: Expected artifacts or links
      placeholder: |
        - reports/week5/README.md
        - reports/week5/images/...
        - GitHub Project link
        - Release link
        - Demo video link
    validations:
      required: false
  - type: textarea
    id: completion-checklist
    attributes:
      label: Completion checklist
      placeholder: |
        - [ ] Required file created or updated
        - [ ] Links verified
        - [ ] Evidence added to Week 5 report
        - [ ] PR reviewed
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Notes
      placeholder: "Add relevant notes, risks, or remaining gaps."
    validations:
      required: false
