name: Course Task
description: Create an Assignment 6 course-process task
title: "Course Task: "
labels:
  - "type: course task"
body:
  - type: markdown
    attributes:
      value: |
        Use this template for Assignment 6 administrative, reporting, evidence, review, release, transition, demo, or documentation tasks.
        Course Task issues do not count toward the required qualifying PBIs.
  - type: input
    id: task-title
    attributes:
      label: Task title
      placeholder: "Prepare Week 6 report screenshots"
    validations:
      required: true
  - type: dropdown
    id: assignment-part
    attributes:
      label: Assignment 6 part
      options:
        - Part 1 - Refine the Product Backlog and Plan Sprint 4 and Sprint 5
        - Part 2 - Deliver the Week 6 Trial Release
        - Part 3 - Polish Customer-Facing Documentation and the Repository Entry Point
        - Part 4 - Maintain the Customer Handover Documentation
        - Part 5 - Conduct the Week 6 Transition-Readiness Meeting and Customer Trial
        - Part 6 - Run Sprint 5 and Perform Follow-Up Maintenance
        - Part 7 - Transition the Product and Release MVP v3
        - Part 8 - Confirm the Final Transition Outcome and Product Usefulness
        - Part 9 - Update and Execute User Acceptance Tests
        - Part 10 - Conduct Sprint Reviews for Week 6 and Week 7
        - Part 11 - Conduct Sprint Retrospectives for Week 6 and Week 7
        - Part 12 - Reflect on Week 6 and Week 7 and Report LLM Usage
        - Part 13 - Prepare, Submit, and Rehearse the Presentation
        - Part 14 - Record a Public Sanitized Demo Video for MVP v3
        - Week 6 README / Moodle PDF
        - Week 7 README / Moodle PDF
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: "Describe the course task and the expected evidence."
    validations:
      required: true
  - type: dropdown
    id: work-status
    attributes:
      label: Work Status
      options:
        - To Do
        - Ready
        - In Progress
        - Review
        - Done
    validations:
      required: true
  - type: input
    id: assignee
    attributes:
      label: Assignee
      placeholder: "@github-username"
    validations:
      required: false
  - type: input
    id: reviewer
    attributes:
      label: Reviewer
      placeholder: "@github-username"
    validations:
      required: false
  - type: textarea
    id: expected-artifacts
    attributes:
      label: Expected artifacts or links
      placeholder: |
        - reports/week6/README.md
        - reports/week6/images/...
        - GitHub Project link
        - Release link
        - docs/customer-handover.md
        - Demo video link
    validations:
      required: false
  - type: textarea
    id: completion-checklist
    attributes:
      label: Completion checklist
      placeholder: |
        - [ ] Required file created or updated
        - [ ] Links verified
        - [ ] Evidence added to Week 6/7 report
        - [ ] PR reviewed
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Notes
      placeholder: "Add relevant notes, risks, or remaining gaps."
    validations:
      required: false

blank_issues_enabled: false
