services:
  faceguard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8501:8501"
    environment:
      TZ: Europe/Moscow
      PGTZ: Europe/Moscow
    volumes:
      - ../backend:/app/backend
      - ../tests:/app/tests
      - ../backend/.streamlit/secrets.toml:/app/.streamlit/secrets.toml:ro
      - ./insightface_models:/root/.insightface/models
    tty: true
    stdin_open: true
    command: streamlit run backend/pages/page_authentication.py
    restart: unless-stopped
