services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: faceguard
      TZ: Europe/Moscow
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      TZ: Europe/Moscow
      PGTZ: Europe/Moscow
    env_file:
      - ../backend/.env
    depends_on:
      - db
    volumes:
      - ../backend:/app/backend
      - ../tests:/app/tests
      - ./insightface_models:/root/.insightface/models
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ../frontend/src:/app/src
    restart: unless-stopped

volumes:
  pgdata:
