services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - ${BACKEND_ENV_FILE:-../backend/.env}
    environment:
      TZ: Europe/Moscow
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file:
      - ${BACKEND_ENV_FILE:-../backend/.env}
    environment:
      TZ: Europe/Moscow
      PGTZ: Europe/Moscow
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./insightface_models:/root/.insightface/models

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_CAMERA_SOURCE: ${VITE_CAMERA_SOURCE:-browser}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  pgdata:
