# Raspberry Pi hardware override. Use together with docker-compose.yml:
# docker compose -f docker/docker-compose.yml -f docker/docker-compose.pi.yml up --build
services:
  backend:
    environment:
      CAMERA_SOURCE: backend
      CAMERA_INDEX: "0"
      GPIO_CHIP: "0"
    devices:
      - /dev/video0:/dev/video0
      - /dev/gpiochip0:/dev/gpiochip0

  frontend:
    build:
      args:
        VITE_CAMERA_SOURCE: backend
