# Raspberry Pi override. Use together with docker/docker-compose.yml.
services:
  db:
    ports: !reset []

  backend:
    environment:
      CAMERA_SOURCE: backend
      CAMERA_INDEX: "${CAMERA_INDEX:-0}"
      GPIO_CHIP: "${GPIO_CHIP:-0}"
    devices:
      - "${CAMERA_DEVICE:-/dev/video0}:/dev/video${CAMERA_INDEX:-0}"
      - "${GPIO_CHIP_DEVICE:-/dev/gpiochip0}:/dev/gpiochip${GPIO_CHIP:-0}"

  frontend:
    build:
      args:
        VITE_CAMERA_SOURCE: backend
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_WS_BASE_URL: ${VITE_WS_BASE_URL:-}
