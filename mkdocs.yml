site_name: FaceGuardV3
site_url: https://innopolis-robotics-society.github.io/FaceGuardV3/
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.integrate
  palette:
    - scheme: default
      primary: indigo
      accent: indigo

docs_dir: docs

nav:
  - Home: index.md
  - Architecture:
      - Overview: architecture/README.md
      - ADRs:
          - ADR-001 Face Recognition Provider Abstraction: architecture/adr/ADR-001-face-recognition-provider-abstraction.md
          - ADR-002 Reject on Status Code Before Embedding Match: architecture/adr/ADR-002-reject-on-status-code-before-embedding-match.md
          - ADR-003 Synchronous Recognition Pipeline for Response Time: architecture/adr/ADR-003-synchronous-recognition-pipeline-for-response-time.md
  - Development Process: development-process.md
  - Quality:
      - Quality Requirements: quality-requirements.md
      - Quality Tests: quality-requirement-tests.md
      - User Acceptance Tests: user-acceptance-tests.md
  - Testing: testing.md
  - Definition of Done: definition-of-done.md
  - Roadmap: roadmap.md
  - Changelog: CHANGELOG.md

plugins:
  - search
  - include-markdown

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.tasklist
  - admonition
