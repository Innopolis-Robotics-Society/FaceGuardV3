site_name: FaceGuardV3
site_url: https://innopolis-robotics-society.github.io/FaceGuardV3/
theme:
  name: material
  font:
    text: Quicksand
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.integrate
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

docs_dir: docs

nav:
  - Home: index.md
  - System Functions: system-functions.md
  - Customer Handover: customer-handover.md
  - Architecture:
      - Overview: architecture/README.md
      - ADRs:
          - ADR-001 Face Recognition Provider Abstraction: architecture/adr/ADR-001-face-recognition-provider-abstraction.md
          - ADR-002 Reject on Status Code Before Embedding Match: architecture/adr/ADR-002-reject-on-status-code-before-embedding-match.md
          - ADR-003 Synchronous Recognition Pipeline for Response Time: architecture/adr/ADR-003-synchronous-recognition-pipeline-for-response-time.md
  - Development Process: development-process.md
  - Contributing: contributing.md
  - Agent Guidance: agents.md
  - Quality:
      - Quality Requirements: quality-requirements.md
      - Quality Tests: quality-requirement-tests.md
      - User Acceptance Tests: user-acceptance-tests.md
  - Testing: testing.md
  - Definition of Done: definition-of-done.md
  - Roadmap: roadmap.md
  - Changelog: changelog.md

plugins:
  - search
  - include-markdown

markdown_extensions:
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.tasklist
  - admonition

extra_css:
  - stylesheets/extra.css
